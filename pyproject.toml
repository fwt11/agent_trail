[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trail"
version = "0.1.0"
description = "Local cross-agent work timeline: discover, browse and resume coding-agent sessions on your machine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "fwt11" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["ai-agents", "coding-agent", "timeline", "session-management", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.scripts]
agent-trail = "agent_trail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_trail = ["static/*"]
