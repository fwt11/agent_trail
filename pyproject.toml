[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "session-trail"
version = "0.6.2"
description = "Local agent workbench: a cross-agent session timeline plus in-app chat with your coding agents, all local-first"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "fwt11" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["ai-agents", "coding-agent", "timeline", "session-management", "local-first", "tray", "systray", "chat", "workbench"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/fwt11/agent_trail"
Repository = "https://github.com/fwt11/agent_trail"
Issues = "https://github.com/fwt11/agent_trail/issues"

[project.optional-dependencies]
# Linux 托盘用系统 GI（无需 extras）；Windows/macOS 托盘用这组
tray = ["pystray>=0.19", "Pillow>=9.0", "pywebview>=5.0"]

[project.scripts]
agent-trail = "agent_trail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_trail = ["static/*", "tray/*.png", "tray/*.template"]
