name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "agent_trail/static/index.html",
              "agent_trail/static/i18n.js",
              "agent_trail/static/app.js",
              "agent_trail/tray/icon.png",
              "agent_trail/tray/desktop.template",
              "agent_trail/tray/app.py",
              "agent_trail/tray/sni.py",
          ]
          missing = [item for item in required if item not in names]
          assert not missing, f"missing from wheel: {missing}"
          print(f"wheel contents OK ({len(names)} files)")
          PY
      - name: Smoke test in a fresh venv
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/pip install --quiet dist/*.whl
          .smoke-venv/bin/agent-trail --help > /dev/null
          .smoke-venv/bin/agent-trail --home "$HOME" --data-dir "$PWD/.smoke-data" scan | tail -2
          test -f "$PWD/.smoke-data/index.sqlite"
          echo "smoke OK"
